name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Poll the SIMPLE index, because that is what pip resolves from.
      #
      # Three shapes of this step have been wrong, each differently. It first
      # polled the simple index but exited SUCCESS on exhaustion, so a real
      # lag surfaced as a confusing install failure. Fixing that moved it to
      # the JSON API and made it fail loudly — but the JSON API publishes
      # seconds ahead of the simple index, so on 0.88.0 the step passed on
      # attempt 1 and `pip install` failed anyway. A gate is only a gate if
      # it waits on the thing the next step actually needs.
      - name: Wait for tollbooth-dpyc on PyPI
        run: |
            set -euo pipefail
            REQUIRED=$(grep -oE 'tollbooth-dpyc(\[[a-z,]+\])?==[0-9.]+' pyproject.toml \
                       | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$REQUIRED" ]; then
              echo "No pinned tollbooth-dpyc version found; nothing to wait for."
              exit 0
            fi
            echo "Waiting for tollbooth-dpyc==$REQUIRED on the PyPI simple index..."
            ESCAPED=${REQUIRED//./\\.}
            for i in $(seq 1 30); do
              # Distribution filenames carry the version; match the dash-delimited
              # form so 0.88.0 cannot be satisfied by 0.88.01.
              if curl -sf "https://pypi.org/simple/tollbooth-dpyc/" \
                   | grep -qE "tollbooth[_-]dpyc-$ESCAPED[-.]"; then
                echo "Found tollbooth-dpyc==$REQUIRED on the simple index (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/30 — not yet resolvable by pip, waiting 10s..."
              sleep 10
            done
            echo "::error::tollbooth-dpyc==$REQUIRED never reached the PyPI simple index after 5 minutes."
            echo "pip resolves from that index, so the install below would fail. Check"
            echo "that the release workflow PyPI publish succeeded before re-running."
            exit 1


      - uses: astral-sh/setup-uv@v10.0.0

      - name: Install dependencies (the lockfile Horizon deploys)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/ -v

      - name: Entrypoint inspects (the check Horizon performs at build time)
        run: |
          [ -f fastmcp.json ] || { echo "no fastmcp.json — not a FastMCP deployment; skipping"; exit 0; }
          # Resolve the entrypoint through fastmcp's OWN config model, not by hand.
          # This read json['server'] — a key not in the schema at all — so it mirrored
          # a format the platform had stopped accepting and could not fail for the real
          # reason. Parsing with MCPServerConfig validates the file as a side effect.
          # Not every repo in the fleet installs with uv — most use `pip install -e`.
          # Hard-coding `uv run` made this guard fail with `uv: command not found`
          # on all of them, which is the same mistake in a new costume: a check
          # that cannot run is not a check.
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then PY="uv run python"; else PY="python"; fi
          TARGET=$($PY -c "
          import json
          from fastmcp.utilities.mcp_server_config import MCPServerConfig
          c = MCPServerConfig.model_validate(json.load(open('fastmcp.json')))
          print(f'{c.source.path}:{c.source.entrypoint or \"mcp\"}')
          ")
          # The environment block is what makes the builder install this project.
          # Without it UVEnvironment.project is None, nothing installs, and the build
          # dies on a preflight import blaming your dependency list.
          $PY -c "
          import json, sys
          from fastmcp.utilities.mcp_server_config import MCPServerConfig
          c = MCPServerConfig.model_validate(json.load(open('fastmcp.json')))
          e = c.environment
          if not (e.project or e.dependencies or e.requirements):
              sys.exit('fastmcp.json declares no environment source '
                       '(project/dependencies/requirements) — the builder would install nothing.')
          print('environment installs:', e.project or e.requirements or e.dependencies)
          "
          echo "inspecting $TARGET"
          if [ -f uv.lock ] && command -v uv >/dev/null 2>&1; then
            uv run fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          else
            fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          fi

      # `modal_app.py` sits outside `src/`, so nothing imported it — ruff read it as text
      # and no test touched it. Its deploy graph (image, mounted source, function spec)
      # was therefore first evaluated during `modal deploy`, i.e. after merge, and a
      # renamed settings property or a bad pyproject reference would surface there.
      #
      # Building the objects needs no Modal credentials: App, Image, and Secret.from_name
      # are all lazy references until a real API call, so this is safe on fork PRs where
      # no token is available. It asserts the deploy would be *attemptable*, not that it
      # succeeded — deploy-modal.yml owns that.
      - name: The detached runner's deploy graph builds
        run: uv run python -c "import modal_app; print('modal_app builds:', modal_app.app.name)"

  # The frontend had no pre-merge build of any kind, so a dependency PR could take a
  # MAJOR version, go green on the Python suite, auto-merge on the `frontend/` low-risk
  # path, and leave the site undeployable for a week before anyone noticed. That is
  # exactly what #285 did with tailwindcss 3 -> 4. This job is the check that was missing.
  #
  # It always runs and carries no `paths:` filter on purpose. A path-filtered job posts no
  # status on PRs that miss the filter, and a required context that sometimes never posts
  # leaves merges pending forever. So it always reports, and skips its own expensive steps
  # when `frontend/` is untouched — which keeps it cheap AND safe to require.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the frontend change?
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "push build — building the frontend."
            echo "any=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
               | grep -qE '^frontend/|^\.github/workflows/(ci|deploy-frontend)\.yml$'; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "frontend untouched — reporting green without building."
          fi

      - uses: actions/setup-node@v7
        if: steps.touched.outputs.any == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs strictly from the lockfile, which is what CI and the deploy both
      # do — so this reproduces the exact resolution that broke, rather than an `npm install`
      # that might paper over it.
      - name: Install from the lockfile
        if: steps.touched.outputs.any == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build
        if: steps.touched.outputs.any == 'true'
        working-directory: frontend
        run: npm run build
        env:
          VITE_MCP_URL: /mcp

      # A build can "succeed" and emit nothing useful. Tailwind failing to load its plugin
      # is the failure we just had; a stylesheet of a few hundred bytes is what that looks
      # like when it degrades rather than throws.
      - name: The stylesheet is not empty
        if: steps.touched.outputs.any == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          css=$(find dist/assets -name '*.css' | head -1)
          [ -n "$css" ] || { echo "::error::no stylesheet emitted"; exit 1; }
          bytes=$(wc -c < "$css")
          echo "emitted $css ($bytes bytes)"
          [ "$bytes" -gt 5000 ] || { echo "::error::stylesheet is $bytes bytes — Tailwind almost certainly did not run"; exit 1; }

  # The scheduler Worker had NO pre-merge check of any kind. Its package-lock.json
  # drifted from package.json somewhere around #285 — the lock still named
  # typescript 5.9.3 and @cloudflare/workers-types 4.x against a manifest asking
  # for ^7 and ^5 — and nothing noticed, because the only thing that ever built
  # it was `deploy-worker.yml`, which runs AFTER merge. So a green PR merged and
  # the deploy died on `npm ci` EUSAGE, leaving main with an undeployable Worker.
  #
  # Exactly the shape the `frontend` job above was added to fix, in the one
  # remaining corner that still had it. Same always-runs / skip-the-expensive-bits
  # structure, so it is cheap AND safe to require as a status context.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the worker change?
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "push build — building the worker."
            echo "any=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
               | grep -qE '^scheduler-worker/|^\.github/workflows/(ci|deploy-worker)\.yml$'; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.touched.outputs.any == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scheduler-worker/package-lock.json

      # `npm ci` is the assertion, not just the install: it FAILS when the lock
      # and the manifest disagree, which is the exact failure deploy-worker.yml
      # hit. Running it here moves that from post-merge to pre-merge.
      - name: Install dependencies (lock must match package.json)
        if: steps.touched.outputs.any == 'true'
        working-directory: scheduler-worker
        run: npm ci

      - name: Typecheck
        if: steps.touched.outputs.any == 'true'
        working-directory: scheduler-worker
        run: npm run typecheck
